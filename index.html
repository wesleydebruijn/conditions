<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conditions</title>
    <style>
      :root {
        --panel-padding: 20px;
        --input-radius: calc(var(--radius) - 2px);
        --shadow-success: 0 0 0 2px hsl(142 71% 45% / 0.2);
        --shadow-error: 0 0 0 2px hsl(0 72% 51% / 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-size: 13px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
      }

      .site-header {
        flex-shrink: 0;
        border-bottom: 1px solid hsl(var(--border));
        background: hsl(var(--card));
      }

      .site-header-inner {
        padding: 10px var(--panel-padding);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .brand-name {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: hsl(var(--foreground));
      }
      .brand-tagline,
      .credit {
        color: hsl(var(--muted-foreground));
      }
      .credit {
        margin-right: 8px;
        font-size: 0.813rem;
      }
      .credit a {
        color: inherit;
        text-decoration: none;
        transition: color 0.15s;
      }
      .credit a:hover {
        color: hsl(var(--foreground));
      }
      @media (max-width: 800px) {
        .brand-tagline,
        .credit {
          display: none;
        }
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .read-only-toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 10px;
        border-radius: var(--input-radius);
        color: hsl(var(--muted-foreground));
        font-size: 0.813rem;
        cursor: pointer;
        user-select: none;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .read-only-toggle:hover {
        color: hsl(var(--foreground));
        background: hsl(var(--foreground) / 0.06);
      }
      .read-only-toggle input {
        position: relative;
        width: 28px;
        height: 16px;
        margin: 0;
        border-radius: 999px;
        background: hsl(var(--input));
        appearance: none;
        cursor: pointer;
        transition: background 0.15s;
      }
      .read-only-toggle input::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: hsl(var(--background));
        transition: transform 0.15s;
      }
      .read-only-toggle input:checked {
        background: hsl(var(--ring));
      }
      .read-only-toggle input:checked::after {
        transform: translateX(12px);
      }
      .read-only-toggle input:focus-visible {
        outline: 2px solid hsl(var(--ring));
        outline-offset: 2px;
      }
      .github-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--input-radius);
        color: hsl(var(--muted-foreground));
        transition:
          color 0.15s,
          background 0.15s;
      }
      .github-link:hover {
        color: hsl(var(--foreground));
        background: hsl(var(--foreground) / 0.06);
      }
      .github-link svg {
        width: 20px;
        height: 20px;
      }

      .theme-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: none;
        border-radius: var(--input-radius);
        background: transparent;
        color: hsl(var(--muted-foreground));
        cursor: pointer;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .theme-toggle:hover {
        color: hsl(var(--foreground));
        background: hsl(var(--foreground) / 0.06);
      }
      .theme-toggle svg {
        width: 20px;
        height: 20px;
      }
      .theme-toggle .icon-sun {
        display: none;
      }
      .theme-toggle .icon-moon {
        display: block;
      }
      html.dark .theme-toggle .icon-sun {
        display: block;
      }
      html.dark .theme-toggle .icon-moon {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light):not(.dark) .theme-toggle .icon-sun {
          display: block;
        }
        html:not(.light):not(.dark) .theme-toggle .icon-moon {
          display: none;
        }
      }

      .builder {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: hsl(var(--secondary-bg));
        padding: 24px var(--panel-padding) 40px;
      }

      .json-drawer {
        flex-shrink: 0;
        border-top: 1px solid hsl(var(--border));
        background: hsl(var(--card));
      }
      .json-drawer summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px var(--panel-padding);
        cursor: pointer;
        list-style: none;
        user-select: none;
      }
      .json-drawer summary::-webkit-details-marker {
        display: none;
      }
      .json-drawer summary::before {
        content: "▸";
        color: hsl(var(--muted-foreground));
        transition: transform 0.15s;
      }
      .json-drawer[open] summary::before {
        transform: rotate(90deg);
      }
      .section-title {
        font-size: 0.813rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: hsl(var(--muted-foreground));
      }

      .json-panels {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        height: 45vh;
        padding: 0 var(--panel-padding) 16px;
      }
      @media (max-width: 1000px) {
        .json-panels {
          grid-template-columns: minmax(0, 1fr);
          overflow: auto;
        }
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .panel label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: hsl(var(--muted-foreground));
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .panel textarea {
        flex: 1;
        width: 100%;
        min-height: 200px;
        resize: none;
        padding: 8px 10px;
        font-size: 10px;
        border-radius: var(--input-radius);
        border: 1px solid hsl(var(--input));
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.45;
        font-family:
          "JetBrains Mono", "Fira Mono", "Consolas", "Menlo", monospace;
      }

      .record textarea.record-input--match {
        border-color: hsl(142 71% 45%);
        box-shadow: var(--shadow-success);
        animation: record-match-pulse 0.6s;
      }
      .record textarea.record-input--no-match {
        border-color: hsl(0 72% 51%);
        box-shadow: var(--shadow-error);
      }

      #result-row {
        margin-left: auto;
        font-size: 13px;
        font-weight: bold;
      }

      @keyframes record-match-pulse {
        0% {
          border-color: hsl(142 71% 45%);
          box-shadow: var(--shadow-success);
        }
        50% {
          border-color: hsl(142 71% 55%);
          box-shadow:
            0 0 0 6px hsl(142 71% 45% / 0.35),
            0 0 20px hsl(142 71% 45% / 0.2);
        }
        100% {
          border-color: hsl(142 71% 45%);
          box-shadow: var(--shadow-success);
        }
      }
    </style>
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light")
          document.documentElement.classList.add(t);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand">
          <span class="brand-name">conditions</span>
        </div>
        <div class="header-actions">
          <span class="credit"
            >by
            <a
              href="https://github.com/wesleydebruijn"
              target="_blank"
              rel="noopener noreferrer"
              >wesley de bruijn</a
            ></span
          >
          <label class="read-only-toggle">
            <input type="checkbox" id="read-only-toggle" role="switch" />
            Read only
          </label>
          <button
            type="button"
            class="theme-toggle"
            aria-label="Toggle theme"
            title="Theme: system"
          >
            <svg
              class="icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg
              class="icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
          </button>
          <a
            href="https://github.com/wesleydebruijn/conditions"
            class="github-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View source on GitHub"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="builder" aria-label="Condition builder">
      <textarea id="condition-value" hidden></textarea>
    </main>

    <details class="json-drawer">
      <summary>
        <span class="section-title">JSON</span>
        <span id="result-row"><b>evaluating...</b></span>
      </summary>
      <div class="json-panels">
        <div class="panel condition">
          <label for="condition-input">Conditions</label>
          <textarea id="condition-input" spellcheck="false"></textarea>
        </div>
        <div class="panel record">
          <label for="record-input">Test record</label>
          <textarea id="record-input" spellcheck="false"></textarea>
        </div>
        <div class="panel">
          <label for="config-input">Config</label>
          <textarea id="config-input" spellcheck="false"></textarea>
        </div>
      </div>
    </details>

    <script type="module">
      import "/src/style.css";
      import Conditions from "/src/conditions.ts";
      import Evaluator from "/src/evaluator.ts";

      const initialConfig = {
        schema: {
          items: {
            label: "Items",
            type: "object[]",
            schema: {
              type: { label: "Type", type: "text" },
              product_category: { label: "Product category", type: "text" },
              provider: { label: "Provider", type: "text" },
              contract_term: { label: "Contract term", type: "number" },
              retention: { label: "Retention", type: "boolean" },
              price: { label: "Price", type: "number" },
              value: { label: "Trade-in value", type: "number" },
              tags: { label: "Tags", type: "text[]" },
              exclusivity_applicable_tags: {
                label: "Exclusivity tags",
                type: "text[]",
              },
              quantity_total: { label: "Quantity", type: "number" },
              quantity_index: { label: "Quantity index", type: "number" },
              id: { label: "ID", type: "text" },
              product_version_id: { label: "Product version ID", type: "text" },
              unique_id: { label: "Unique ID", type: "text" },
              key: { label: "Key", type: "text" },
              unit_keys: { label: "Unit keys", type: "text[]" },
              imei: { label: "IMEI", type: "text" },
              delivery_option_id: { label: "Delivery option ID", type: "text" },
            },
          },
        },
      };
      const initialRecord = {
        items: [
          {
            id: 4,
            type: "proposition",
            product_category: "sim-only",
            product_version_id: null,
            unique_id: "proposition:1-2|3-4|pv-5",
            key: "1-2|3-4|pv-5",
            unit_keys: ["1-2", "3-4", "pv-5"],
            provider: "KPN",
            contract_term: 24,
            retention: true,
            price: 0.0,
            tags: [],
            exclusivity_applicable_tags: [],
            quantity_total: 1,
            quantity_index: 1,
          },
          {
            id: 1,
            type: "product",
            product_category: "smartphone",
            product_version_id: 666,
            unique_id: "product:666",
            price: 0.0,
            tags: ["version-tag", "product-tag"],
            exclusivity_applicable_tags: [],
            quantity_total: 1,
            quantity_index: 1,
          },
          {
            id: 6,
            type: "outlet_product",
            product_category: "smartphone",
            product_version_id: 666,
            unique_id: "outlet_product:123456789012345",
            price: 0.0,
            tags: ["version-tag", "product-tag"],
            imei: 123456789012345,
            exclusivity_applicable_tags: [],
            quantity_total: 1,
            quantity_index: 1,
          },
          {
            id: 5,
            type: "trade_in",
            unique_id: "trade_in:5",
            value: 100,
            price: 0.0,
            exclusivity_applicable_tags: [],
            quantity_total: 1,
            quantity_index: 1,
          },
          {
            id: 3,
            type: "delivery_option",
            delivery_option_id: 888,
            unique_id: "delivery_option:888",
            price: 0.0,
            exclusivity_applicable_tags: [],
            quantity_total: 1,
            quantity_index: 1,
          },
        ],
      };
      const initialCondition = {
        and: [
          {
            items_count: {
              gte: 1,
              where: {
                type: { eq: "proposition" },
                provider: { eq: "KPN" },
                contract_term: { gte: 24 },
              },
            },
          },
          {
            items_count: {
              gte: 1,
              where: { product_category: { eq: "smartphone" } },
            },
          },
          {
            items_value_sum: {
              gte: 50,
              where: { type: { eq: "trade_in" } },
            },
          },
        ],
      };

      const recordInput = document.getElementById("record-input");
      const conditionInput = document.getElementById("condition-input");
      const conditionValue = document.getElementById("condition-value");
      const configInput = document.getElementById("config-input");
      const resultRow = document.getElementById("result-row");
      const readOnlyToggle = document.getElementById("read-only-toggle");

      readOnlyToggle.addEventListener("change", () => {
        conditionValue.conditions?.setReadOnly(readOnlyToggle.checked);
      });

      function debounce(fn, ms) {
        let timeoutId;
        return function (...args) {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(() => fn.apply(this, args), ms);
        };
      }

      function build() {
        conditionValue.conditions?.destroy();
        conditionValue.value = conditionInput.value;

        let config;
        try {
          config = JSON.parse(configInput.value);
        } catch {
          config = {};
        }

        new Conditions(conditionValue, {
          ...config,
          readOnly: readOnlyToggle.checked,
        });
      }

      function evaluate() {
        recordInput.classList.remove(
          "record-input--match",
          "record-input--no-match",
        );
        try {
          const config = JSON.parse(configInput.value);
          const condition = JSON.parse(conditionInput.value);
          const record = JSON.parse(recordInput.value);

          const match = new Evaluator(condition).match(record);

          resultRow.innerHTML = match ? "Match ✅" : "No Match ❌";
          if (match) {
            recordInput.classList.remove("record-input--match");
            recordInput.classList.add("record-input--match");
          } else {
            recordInput.classList.add("record-input--no-match");
          }
        } catch {
          resultRow.innerHTML = '<span style="color: red">Invalid JSON</span>';
          recordInput.classList.add("record-input--no-match");
        }
      }

      function init() {
        configInput.value = JSON.stringify(initialConfig, null, 2);
        conditionInput.value = JSON.stringify(initialCondition, null, 2);
        recordInput.value = JSON.stringify(initialRecord, null, 2);

        const debouncedEvaluate = debounce(evaluate, 100);
        const debouncedBuild = debounce(build, 100);

        recordInput.addEventListener("input", debouncedEvaluate);
        recordInput.addEventListener("change", debouncedEvaluate);
        conditionInput.addEventListener("input", debouncedEvaluate);
        conditionInput.addEventListener("change", debouncedEvaluate);
        conditionInput.addEventListener("input", debouncedBuild);
        conditionValue.addEventListener("change", () => {
          conditionInput.value = conditionValue.value;
          evaluate();
        });
        configInput.addEventListener("input", debouncedEvaluate);
        configInput.addEventListener("change", debouncedEvaluate);
        configInput.addEventListener("input", debouncedBuild);
        configInput.addEventListener("change", debouncedBuild);

        build();
        evaluate();
      }

      init();

      (function () {
        var html = document.documentElement;
        var btn = document.querySelector(".theme-toggle");
        if (!btn) return;
        function apply(theme) {
          html.classList.remove("light", "dark");
          if (theme) html.classList.add(theme);
          localStorage.setItem("theme", theme || "");
          btn.title = "Theme: " + (theme || "system");
        }
        btn.addEventListener("click", function () {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
          apply(dark ? "light" : "dark");
        });
        apply(localStorage.getItem("theme"));
      })();
    </script>
  </body>
</html>
